name: Build PianoShelf APK (Debug + Release)

# 触发条件：
#   - push 到 main / master
#   - 创建 tag v*（发 Draft Release 时会同时挂载 Debug + Release 两个 APK）
#   - PR（避免 PR 引入构建回归）
#   - workflow_dispatch 手动触发（可手动挑分支）
on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  # 构建脚本会读取这些环境变量用于 release 签名（pianoshelf.gradle 内约定的名字）
  # 值通过 secrets.* 注入；未配置 secret 时 gradle 会 fallback 到 debug keystore。
  PIANOSHELF_KEYSTORE_FILE: ${{ github.workspace }}/.ci-keystore.jks
  PIANOSHELF_KEYSTORE_PASSWORD: ${{ secrets.PIANOSHELF_KEYSTORE_PASSWORD }}
  PIANOSHELF_KEY_ALIAS:          ${{ secrets.PIANOSHELF_KEY_ALIAS || 'pianoshelf' }}
  PIANOSHELF_KEY_PASSWORD:       ${{ secrets.PIANOSHELF_KEY_PASSWORD }}

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DISTRO }})
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle environment (no wrapper, use actions/gradle-build-action)
        uses: gradle/actions/setup-gradle@v5
        with:
          # 本仓库暂未提交 gradle-wrapper.jar/gradlew，指定版本由 action 自动下载
          gradle-version: '8.14.5'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Cache Android SDK components
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/cache
            ~/Android/Sdk/platforms
            ~/Android/Sdk/build-tools
            ~/Android/Sdk/licenses
          key: android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-v3

      - name: Install required Android SDK (platforms + build-tools) via sdkmanager
        run: |
          set -euo pipefail
          ANDROID_HOME="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # ── 关键点 1：cmdline-tools/latest/bin 放到 GITHUB_PATH，影响后续 step
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # ── 关键点 2：同时更新当前 step 的 $PATH（否则 sdkmanager 本 step 内就找不到）
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_ZIP="$HOME/.android/cache/cmdline-tools-11076708-linux.zip"
            mkdir -p "$HOME/.android/cache"
            if [ ! -f "$CMDLINE_ZIP" ]; then
              curl -fsSL --retry 3 --output "$CMDLINE_ZIP" \
                "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            fi
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            TMP_UNPACK="$ANDROID_HOME/cmdline-tools/_tmp_unpack"
            rm -rf "$TMP_UNPACK"
            unzip -q "$CMDLINE_ZIP" -d "$TMP_UNPACK"
            # ── 关键点 3：zip 根目录就是 cmdline-tools，内部是 bin/ 和 lib/
            #    正确安装到 cmdline-tools/latest/{bin,lib} 而非 latest/cmdline-tools/...
            #    官方推荐路径：$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
            if [ -d "$TMP_UNPACK/cmdline-tools/bin" ]; then
              # 新 zip 结构：cmdline-tools/bin 直接在根
              mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
              mv "$TMP_UNPACK/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
              rm -rf "$TMP_UNPACK/cmdline-tools"
            else
              # 老 zip 兜底：内部有 latest 或某个子目录，按名迁移
              mv "$TMP_UNPACK/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            rm -rf "$TMP_UNPACK"
          fi

          # 验证 sdkmanager 路径
          echo "which sdkmanager: $(which sdkmanager || true)"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/" || true

          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          # 新版 cmdline-tools (11076708+) 默认走 HTTPS，并且不再支持 --no_https 参数
          sdkmanager --sdk_root="$ANDROID_HOME" --verbose \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

      - name: Decode release keystore (if secret PIANOSHELF_KEYSTORE_BASE64 is set)
        id: keystore
        run: |
          set -euo pipefail
          TARGET="$PIANOSHELF_KEYSTORE_FILE"
          if [ -n "${{ secrets.PIANOSHELF_KEYSTORE_BASE64 }}" ]; then
            echo '::group::Decoding keystore from secret PIANOSHELF_KEYSTORE_BASE64'
            echo "${{ secrets.PIANOSHELF_KEYSTORE_BASE64 }}" | base64 -d > "$TARGET"
            ls -la "$TARGET"
            echo "decoded=yes" >> "$GITHUB_OUTPUT"
            echo '::endgroup::'
          else
            echo "::warning::PIANOSHELF_KEYSTORE_BASE64 not set. Release APK will be signed with SDK debug keystore (fallback in pianoshelf.gradle)."
            echo "decoded=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug + Release APKs
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 关键诊断：确认 gradle 可执行文件真的在 PATH 上（setup-gradle@v5 在 Node24 下已修复该问题）
          echo "PATH=$PATH"
          echo "which gradle=$(which gradle || echo NOT_FOUND)"
          echo "gradle --version head:"
          gradle --version 2>&1 | head -8 || {
            echo "::error::gradle command not available after setup-gradle step. PATH check above.";
            exit 2;
          }
          # 同时构建 Debug 和 Release；Release 签名逻辑见 pianoshelf.gradle
          gradle --no-daemon --stacktrace \
            assembleDebug assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:-UseContainerSupport"

      - name: Locate outputs and compute checksums
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          locate_apk() {
            # $1 = build type: debug|release
            local type="$1"
            local dir="build/outputs/apk/${type}"
            # AGP 单模块输出默认名 app-${type}.apk；我们不假定，直接按目录找
            local candidate
            candidate=$(find "$dir" -maxdepth 2 -type f -name "*.apk" | head -n1 || true)
            if [ -z "$candidate" ]; then
              echo "::error::No .apk found under $dir. Listing:"
              ls -R "$dir" || true
              exit 1
            fi
            local final_name="PianoShelf-${type}-${SHORT_SHA}.apk"
            if [ "$candidate" != "$dir/$final_name" ]; then
              mv "$candidate" "$dir/$final_name"
            fi
            ( cd "$dir" && sha256sum "$final_name" > "$final_name.sha256" )
            # 注意：同一个 step 里不能用 steps.meta.outputs.* 引用自己，
            # 所以同时写入 GitHub outputs 与 shell 环境，后面 cat/ls 直接用变量。
            {
              echo "${type}_dir=$dir"
              echo "${type}_src=$dir/$final_name"
              echo "${type}_name=$final_name"
              echo "${type}_sha=$dir/$final_name.sha256"
            } >> "$GITHUB_OUTPUT"
            printf '%s' "$dir/$final_name"       > "/tmp/_ps_${type}_src"
            printf '%s' "$dir/$final_name.sha256" > "/tmp/_ps_${type}_sha"
            printf '%s' "$final_name"             > "/tmp/_ps_${type}_name"
          }

          locate_apk debug
          locate_apk release

          DEBUG_SRC="$(cat /tmp/_ps_debug_src)"; DEBUG_SHA="$(cat /tmp/_ps_debug_sha)"
          REL_SRC="$(cat /tmp/_ps_release_src)"; REL_SHA="$(cat /tmp/_ps_release_sha)"

          echo "--- Debug APK ---"
          cat "$DEBUG_SHA"
          ls -la "$DEBUG_SRC"
          echo "--- Release APK ---"
          cat "$REL_SHA"
          ls -la "$REL_SRC"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: PianoShelf-debug-apk
          path: |
            ${{ steps.meta.outputs.debug_src }}
            ${{ steps.meta.outputs.debug_sha }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: PianoShelf-release-apk
          path: |
            ${{ steps.meta.outputs.release_src }}
            ${{ steps.meta.outputs.release_sha }}
          if-no-files-found: error
          retention-days: 90

      - name: Job summary
        run: |
          {
            echo "### Build completed ✅"
            echo
            echo "- Keystore provided: **${{ steps.keystore.outputs.decoded == 'yes' && 'YES (custom)' || 'NO (signed with SDK debug.keystore)' }}**"
            echo
            echo "| Variant | Artifact name | File | SHA-256 |"
            echo "|---|---|---|---|"
            echo "| Debug | PianoShelf-debug-apk | \`${{ steps.meta.outputs.debug_name }}\` | \`$(awk '{print $1}' ${{ steps.meta.outputs.debug_sha }})\` |"
            echo "| Release | PianoShelf-release-apk | \`${{ steps.meta.outputs.release_name }}\` | \`$(awk '{print $1}' ${{ steps.meta.outputs.release_sha }})\` |"
            echo
            echo "Download: open **Summary** tab → scroll to **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

  # 打 tag v* 时：把 Debug + Release APK 一起挂到 GitHub Draft Release
  draft-release:
    name: Draft Release (on tag)
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Debug APK artifact
        uses: actions/download-artifact@v5
        with:
          name: PianoShelf-debug-apk
          path: apk/
      - name: Download Release APK artifact
        uses: actions/download-artifact@v5
        with:
          name: PianoShelf-release-apk
          path: apk/

      - name: Enumerate files before release upload
        run: ls -la apk/

      - name: Create GitHub Release (draft) + upload Debug & Release APKs
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            apk/PianoShelf-debug-*.apk
            apk/PianoShelf-debug-*.sha256
            apk/PianoShelf-release-*.apk
            apk/PianoShelf-release-*.sha256
