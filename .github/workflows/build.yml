name: Build PianoShelf APK

# 触发条件：
#   - push 到 main / master / trae/** / release/**
#   - 创建 tag v*（可选，方便发布）
#   - PR（避免 PR 里引入构建回归）
#   - 也可以手动触发（Actions 页 Run workflow）
on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DISTRO }})
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle wrapper / environment (no wrapper, use actions/gradle-build-action)
        uses: gradle/actions/setup-gradle@v4
        with:
          # 本仓库暂未提交 gradle-wrapper.jar/gradlew，下面我们提供 GRADLE_VERSION 让它自动下载 Gradle
          gradle-version: '8.14.5'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ~/Android/Sdk/platforms
            ~/Android/Sdk/build-tools
            ~/Android/Sdk/licenses
          key: android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-v1

      - name: Install required Android SDK (platforms + build-tools) via sdkmanager
        run: |
          set -euo pipefail
          ANDROID_HOME="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          # 下载 cmdline-tools（如果缓存没命中）
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_ZIP="$HOME/.android/cache/cmdline-tools-11076708-linux.zip"
            mkdir -p "$HOME/.android/cache"
            if [ ! -f "$CMDLINE_ZIP" ]; then
              curl -fsSL --retry 3 --output "$CMDLINE_ZIP" \
                "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            fi
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            TMP_UNPACK="$ANDROID_HOME/cmdline-tools/_tmp_unpack"
            rm -rf "$TMP_UNPACK"
            unzip -q "$CMDLINE_ZIP" -d "$TMP_UNPACK"
            # sdkmanager 要求装在 cmdline-tools/latest 下
            mv "$TMP_UNPACK/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$TMP_UNPACK"
          fi

          # 自动接受许可
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_HOME" --no_https=false --verbose \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

      - name: Build Debug APK (gradle assembleDebug)
        run: |
          set -euo pipefail
          # AGP 需要知道 local.properties 里的 sdk.dir；用 ANDROID_HOME 生成一份即可
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace \
            assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:-UseContainerSupport"

      - name: Locate outputs and compute checksums
        id: meta
        run: |
          set -euo pipefail
          APK_DIR="build/outputs/apk/debug"
          APK_SRC="$APK_DIR/app-debug.apk"
          # 我们的项目是 rootProject=PianoShelf 单模块，AGP 默认输出 app-debug.apk
          if [ -f "$APK_DIR/PianoShelf-debug.apk" ]; then
            APK_SRC="$APK_DIR/PianoShelf-debug.apk"
          elif [ -f "$APK_DIR/app-debug.apk" ]; then
            APK_SRC="$APK_DIR/app-debug.apk"
          else
            echo "::error::APK not found under $APK_DIR. Listing:"
            ls -R "$APK_DIR" || true
            exit 1
          fi

          APK_NAME="PianoShelf-debug-$(echo "${GITHUB_SHA}" | cut -c1-7).apk"
          mv "$APK_SRC" "$APK_DIR/$APK_NAME"

          cd "$APK_DIR"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "apk_path=$APK_DIR/$APK_NAME"         >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME"                   >> "$GITHUB_OUTPUT"
          echo "apk_dir=$APK_DIR"                     >> "$GITHUB_OUTPUT"
          echo "sha_path=$APK_DIR/$APK_NAME.sha256"   >> "$GITHUB_OUTPUT"

          echo "--- build metadata ---"
          echo "APK=$APK_DIR/$APK_NAME"
          cat "$APK_NAME.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoShelf-debug-apk
          path: |
            ${{ steps.meta.outputs.apk_path }}
            ${{ steps.meta.outputs.sha_path }}
          if-no-files-found: error
          # artifact 默认保留 90 天（免费仓库）
          retention-days: 90

      - name: Summary (Job summary with direct download hint)
        run: |
          {
            echo "### Build completed ✅"
            echo
            echo "- Artifact name: **PianoShelf-debug-apk**"
            echo "- APK file: \`${{ steps.meta.outputs.apk_name }}\`"
            echo "- SHA-256: \`$(awk '{print $1}' ${{ steps.meta.outputs.sha_path }})\`"
            echo
            echo "Download path: go to the **Summary** tab of this run, scroll to **Artifacts**."
          } >> "$GITHUB_STEP_SUMMARY"

  # 可选：打 tag 时把 APK 上传到 GitHub Release Draft
  release-upload:
    name: Draft Release (on tag)
    needs: build-debug-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: PianoShelf-debug-apk
          path: apk/

      - name: Create GitHub Release (draft) + upload APK
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            apk/PianoShelf-debug-*.apk
            apk/PianoShelf-debug-*.sha256
