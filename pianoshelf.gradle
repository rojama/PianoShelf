// Single-module Android application build.gradle
// This project was migrated from legacy Ant-based build and extended with
// online MusicXML browsing/download features (Mutopia catalog + platform WebView).
apply plugin: 'com.android.application'

android {
    namespace 'com.rojama.pianoshelf'
    compileSdk 34

    defaultConfig {
        applicationId "com.rojama.pianoshelf"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "2.1.0-online-catalog"
    }

    // Release 签名配置：优先读取环境变量（CI 通过 GitHub Secrets 注入），
    // 其次读取项目根目录下的 signing.properties（本地开发用，不进 git）。
    // 两者都没有时，release 会使用 Android SDK 自带的 debug keystore 签名，
    // 保证 assembleRelease 产物也是可直接安装的 release APK，
    // 但正式对外分发请务必替换为你自己的 keystore。
    def signingEnvFile = file("${rootDir}/signing.properties")
    def signingFromEnv = [
        keyStorePath   : System.getenv('PIANOSHELF_KEYSTORE_FILE'),
        keyStorePassword: System.getenv('PIANOSHELF_KEYSTORE_PASSWORD'),
        keyAlias       : System.getenv('PIANOSHELF_KEY_ALIAS')          ?: 'pianoshelf',
        keyPassword    : System.getenv('PIANOSHELF_KEY_PASSWORD')
    ]
    // 没有 key password 时，默认用 store password
    if (signingFromEnv.keyPassword == null || signingFromEnv.keyPassword.empty) {
        signingFromEnv.keyPassword = signingFromEnv.keyStorePassword
    }

    def props = new Properties()
    if (signingEnvFile.isFile()) {
        signingEnvFile.withInputStream { props.load(it) }
    }
    def signingFromProps = [
        keyStorePath   : props.getProperty('storeFile'),
        keyStorePassword: props.getProperty('storePassword'),
        keyAlias       : props.getProperty('keyAlias')     ?: 'pianoshelf',
        keyPassword    : props.getProperty('keyPassword')  ?: props.getProperty('storePassword')
    ]

    def useCustom = signingFromEnv.keyStorePath && file(signingFromEnv.keyStorePath).isFile()
    def useProps  = !useCustom && signingFromProps.keyStorePath && file(signingFromProps.keyStorePath).isFile()
    def chosen = useCustom ? signingFromEnv : (useProps ? signingFromProps : null)

    // 终极兜底：如果以上两条都没有可用 signingConfig，就用 Android SDK 默认 debug keystore 的参数，
    // 在 build/intermediates/ci-signing/ 下动态生成一个 JKS（口令/alias 同 SDK debug.keystore）。
    // 这样 CI 环境即便没有 ~/.android/debug.keystore，release APK 也一定能签名成功。
    if (chosen == null) {
        File debugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
        if (!debugKeystore.isFile()) {
            File ciDir = file("${buildDir}/intermediates/ci-signing")
            ciDir.mkdirs()
            File ciJks = new File(ciDir, "ci-release-fallback.jks")
            if (!ciJks.isFile()) {
                String dn = "C=US, O=Android, CN=Android Debug"
                try {
                    def cmd = ["keytool", "-genkeypair",
                               "-alias", "androiddebugkey",
                               "-keyalg", "RSA", "-keysize", "2048",
                               "-validity", "10950",
                               "-storetype", "JKS",
                               "-keypass", "android",
                               "-storepass", "android",
                               "-dname", dn,
                               "-keystore", ciJks.absolutePath]
                    project.logger.lifecycle("Generating fallback CI signing keystore: $ciJks")
                    def proc = cmd.execute()
                    def baos = new ByteArrayOutputStream()
                    proc.consumeProcessOutput(baos, baos)
                    int rc = proc.waitFor()
                    if (rc != 0) {
                        project.logger.warn("keytool rc=$rc output:\n${baos.toString('UTF-8')}")
                    }
                } catch (Exception e) {
                    project.logger.warn("Failed to generate fallback CI keystore via keytool: ${e.message}")
                    // keytool 执行失败就不赋值给 chosen，下面仍会走 APK 无签名路径（INSTALL_PARSE_FAILED）
                }
            }
            if (ciJks.isFile()) {
                chosen = [
                    keyStorePath   : ciJks.absolutePath,
                    keyStorePassword: 'android',
                    keyAlias       : 'androiddebugkey',
                    keyPassword    : 'android'
                ]
            }
        } else {
            chosen = [
                keyStorePath   : debugKeystore.absolutePath,
                keyStorePassword: 'android',
                keyAlias       : 'androiddebugkey',
                keyPassword    : 'android'
            ]
        }
    }

    signingConfigs {
        release {
            // 为了兼容旧手机（本项目 minSdk=21，Android 5.0/6.0/7.0），显式开启 v1(JAR) + v2(APK)。
            // Android 5/6 解析包时只认 v1 MANIFEST.MF/CERT.SF/CERT.RSA，
            // 如果只打 v2/v3-only 签名会导致"解析软件包时出现问题 (33) packageInfo is null"。
            v1SigningEnabled true
            v2SigningEnabled true
            v3SigningEnabled false
            v4SigningEnabled false

            if (chosen != null) {
                storeFile file(chosen.keyStorePath)
                storePassword chosen.keyStorePassword
                keyAlias chosen.keyAlias
                keyPassword chosen.keyPassword
                project.logger.lifecycle("release signingConfig: storeFile=${chosen.keyStorePath}, alias=${chosen.keyAlias}")
            } else {
                project.logger.warn("No release signingConfig available. " +
                    "Release APK will be unsigned and CANNOT be installed on any device. " +
                    "Set PIANOSHELF_KEYSTORE_* env vars or /signing.properties.")
            }
        }
    }

    // Source sets kept identical to legacy Ant layout so we don't need to move files.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            // 注意：src/ 下既包含应用代码 com.rojama.pianoshelf，
            // 也包含 Zong MusicXML 解析器的源码 com.xenoage.zong（含 Mxl* 绑定、符号等子包）。
            // 这些源码必须一起编译（lib/*.jar 只提供 Zong 的 core/io/pdlib 运行时层）。
            // 所有源码现已统一为 UTF-8 编码，不再有 unmappable character 问题。
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            if (file('assets').isDirectory()) assets.srcDirs = ['assets']
            if (file('libs').isDirectory())   jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // 全部源码已统一转换为 UTF-8（包括中文注释），使用默认 encoding 即可
    }

    buildTypes {
        debug {
            minifyEnabled false
            // debug 用 applicationId 后缀避免与 release 冲突，可选；此处不加以简化安装
        }
        release {
            // 有可用签名配置时就用 release signingConfig 签名；没有时 fallback 到 SDK debug keystore
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            // release 包也默认不做 R8 收缩，便于比对和排错；需要时把两行改成 true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'GradleDeprecated', 'OldTargetApi', 'Deprecated', 'ObsoleteSdkInt',
                'AllowBackup', 'ExplicitSystem'
    }

    packagingOptions {
        // 旧 jars (Zong core/util/pdlib) 常带重复的 META-INF，直接忽略
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/license',
                         'META-INF/notice', 'META-INF/DEPENDENCIES', 'META-INF/ASL2.0',
                         'META-INF/LGPL2.1']
        }
    }
}

// ----- 依赖 -----
dependencies {
    // AndroidX / Material
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.12.0'

    // 网络：OkHttp（Mutopia Catalog + OnlineDownloader + WebView 拦截内部下载）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 原 Ant 构建下的 3 个本地 jars（Zong MusicXML 解析）：core.jar / pdlib.jar / util.jar
    implementation fileTree(dir: 'lib', include: ['*.jar'])
}
